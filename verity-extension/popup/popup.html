<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verity Shield</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="brand">
        <span class="status-dot dot-neutral" id="header-status-dot" aria-hidden="true"></span>
        <span class="app-title">🛡️ Verity Shield</span>
      </div>
      <nav class="lang-pills" role="tablist" aria-label="Select Language">
        <button type="button" role="tab" class="lang-pill active" data-lang="en" aria-selected="true">EN</button>
        <button type="button" role="tab" class="lang-pill" data-lang="ta" aria-selected="false">தமிழ்</button>
        <button type="button" role="tab" class="lang-pill" data-lang="hi" aria-selected="false">हिं</button>
        <button type="button" role="tab" class="lang-pill" data-lang="te" aria-selected="false">తె</button>
      </nav>
    </header>
    <main class="main-content">
      <section class="section-card">
        <h2 class="section-label" id="label-current-site">Current Website</h2>
        <div class="traffic-card card-safe" id="current-site-card" role="status" aria-live="polite">
          <div class="traffic-header">
            <span class="traffic-indicator" id="current-site-indicator" aria-hidden="true">🟢</span>
            <div class="traffic-meta">
              <div class="traffic-badge" id="current-site-status">SAFE WEBSITE</div>
              <div class="traffic-domain" id="current-site-domain">loading...</div>
            </div>
            <div class="traffic-score" id="current-site-score" aria-label="Risk score">0/100</div>
          </div>
          <ul class="reasons-list hidden" id="current-site-reasons"></ul>
        </div>
      </section>
      <section class="section-card">
        <h2 class="section-label" id="label-quick-checker">Quick WhatsApp / Link Checker</h2>
        <div class="checker-input-wrap">
          <textarea id="checker-input" class="checker-textarea" rows="3" maxlength="5000" placeholder="Paste suspicious WhatsApp link, SMS, or message here..."></textarea>
          <div class="checker-footer">
            <span class="char-count" id="char-count">0/5000</span>
            <button type="button" id="btn-check" class="btn-check">Check Link / Text</button>
          </div>
        </div>
        <div class="traffic-card hidden" id="scan-result-card" role="status" aria-live="polite">
          <div class="traffic-header">
            <span class="traffic-indicator" id="scan-indicator" aria-hidden="true">🟢</span>
            <div class="traffic-meta">
              <div class="traffic-badge" id="scan-status">SAFE</div>
              <div class="traffic-score-sub" id="scan-score-sub">Score: 0/100</div>
            </div>
          </div>
          <ul class="reasons-list hidden" id="scan-reasons"></ul>
          <details class="why-details hidden" id="scan-why-details">
            <summary class="why-summary" id="scan-why-summary">How did we catch this?</summary>
            <div class="why-body" id="scan-why-body"></div>
          </details>
        </div>
      </section>
      <section class="golden-box" id="golden-box">
        <div class="golden-title" id="golden-title">Golden Safety Rule</div>
        <p class="golden-text" id="golden-text"></p>
      </section>
    </main>
    <footer class="footer">
      <div class="privacy-note" id="privacy-note">Everything is checked on your device. Nothing is uploaded.</div>
      <button type="button" class="btn-advanced" id="btn-toggle-advanced" aria-expanded="false" aria-controls="advanced-pre">Advanced Details</button>
      <pre class="advanced-pre hidden" id="advanced-pre" tabindex="0"></pre>
    </footer>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
